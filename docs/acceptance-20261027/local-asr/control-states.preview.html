<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地字幕组件状态预览</title><link rel="stylesheet" href="../../../static/creative.css"><link rel="stylesheet" href="../../../static/theme.css"><style>body{background:var(--theme-bg);color:var(--theme-body);font-family:system-ui;padding:24px}main{max-width:640px;margin:auto}.state{padding:16px 0;border-bottom:1px solid var(--theme-line)}button{padding:10px 16px;border:1px solid var(--theme-line);border-radius:8px;background:var(--theme-inset);color:var(--theme-body)}small{display:block;margin-bottom:8px}label{display:block}</style></head><body class="site-app owner-workspace"><main class="local-asr-panel"><h1>本地字幕 · 组件状态预览</h1><p>仅用于审核组件；不运行语音识别、不作为产品页面。</p><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">切换明暗</button><div class="state"><small>default</small><button>提取本地字幕</button></div><div class="state"><small>hover</small><button class="is-hover">提取本地字幕</button></div><div class="state"><small>focus-visible</small><button class="is-focus">提取本地字幕</button></div><div class="state"><small>active</small><button class="is-active">提取本地字幕</button></div><div class="state"><small>disabled</small><button disabled>提取本地字幕</button><p>请先选择视频并配置本地引擎。</p></div><div class="state" aria-busy="true"><small>loading</small><button disabled>提取本地字幕</button><p role="status">正在本机提取音轨并识别字幕；不联网。</p></div><div class="state"><small>error</small><button>提取本地字幕</button><p role="alert">未取得有效音轨，请检查视频或人工粘贴逐字稿。</p></div><div class="state"><small>success</small><button>下载 SRT</button><p>已取得估计字幕，未经人工校对；保存任务后可重开。</p></div></main></body></html>
