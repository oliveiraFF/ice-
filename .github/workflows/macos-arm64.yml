name: macOS Apple Silicon test package

# Ordinary commits never run this job. A test tag is an explicit build request,
# allowing candidate verification before merging an untested Mac port into main.
on:
  push:
    tags:
      - 'ice-macos-test-*'
  workflow_dispatch:
    inputs:
      free_billing_verified:
        description: 'Owner verified Actions and storage cannot charge beyond included quota'
        type: boolean
        required: true
        default: false
      version:
        description: 'Test package version YYYY.MM.DD.N'
        type: string
        required: true
        default: '2026.10.30.1'

permissions:
  contents: read

concurrency:
  group: ice-macos-arm64
  cancel-in-progress: false

jobs:
  package:
    # These confirmations are administrative gates, NOT a replacement for GitHub's billing limit.
    if: ${{ vars.ICE_MACOS_FREE_BILLING_VERIFIED == 'true' && (github.event_name == 'push' || inputs.free_billing_verified == true) }}
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PACKAGE_VERSION: ${{ inputs.version || '2026.10.30.1' }}
      MAC_RELEASE: ../ice-macos-release
      TIKHUB_API_KEY: ''
      LLM_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Require native ARM64 and install build dependencies
        run: |
          test "$(uname -m)" = arm64
          python -m pip install -r packaging/requirements-macos.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Build ad-hoc signed app and DMG
        run: python build_macos.py --output "$MAC_RELEASE" --version "$PACKAGE_VERSION"
      - name: Native window, system Keychain, read-only DMG and reopen checks
        run: python tests/check_macos_bundle.py --release "$MAC_RELEASE"
      - name: Save successful test package and evidence for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ICE-macOS-arm64-test
          path: |
            ${{ env.MAC_RELEASE }}/*.dmg
            ${{ env.MAC_RELEASE }}/receipt.json
            ${{ env.MAC_RELEASE }}/MANIFEST.sha256
            ${{ env.MAC_RELEASE }}/native-smoke.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
